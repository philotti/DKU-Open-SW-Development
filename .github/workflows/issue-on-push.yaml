name: Create Issue on Push

on:
  push:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUSHER: ${{ github.actor }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      SERVER_URL: ${{ github.server_url }}
    steps:
      - name: Create an issue with GitHub CLI
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Push detected on $REF_NAME" \
            --body "A push was made by $PUSHER to $REF_NAME.

          Commit: $SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
